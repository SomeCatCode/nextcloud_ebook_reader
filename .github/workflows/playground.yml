name: Playground

# Updates the branch `playground` that the Nextcloud Playground blueprint loads its files from
# (see playground/README.md): blueprint.json, README.md and the app package of a release as ZIP.
# The sample books in books/ stay. The branch always has a single commit.
#
# Runs after every release (job `playground` in release.yml) or on request.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose package goes into the playground
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = latest release)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: playground
  cancel-in-progress: false

jobs:
  playground:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: playground
          path: branch

      - name: App package of the release as ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"; fi
          echo "Release: $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern ebookreader.tar.gz --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha256sum ebookreader.tar.gz)
          mkdir "$RUNNER_TEMP/app"
          tar -xzf "$RUNNER_TEMP/ebookreader.tar.gz" -C "$RUNNER_TEMP/app"
          test -f "$RUNNER_TEMP/app/ebookreader/appinfo/info.xml"
          rm -f branch/ebookreader.zip
          (cd "$RUNNER_TEMP/app" && zip -qrX "$GITHUB_WORKSPACE/branch/ebookreader.zip" ebookreader)
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Replace the branch with one new commit
        working-directory: branch
        run: |
          cp ../source/playground/blueprint.json blueprint.json
          cp ../source/playground/README.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan next
          git add -A
          git commit -q -m "Playground files for $TAG"
          git push -f origin next:playground

name: Release

# Creates a GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The version is taken from the tag and written into appinfo/info.xml for the
# build. Tags with a suffix (e.g. v0.2.0-beta.1) become pre-releases.
#
# Optional repository secrets:
#   APP_PRIVATE_KEY  - Nextcloud App Store signing key (ebookreader.key); adds ebookreader.tar.gz.sig
#   APPSTORE_TOKEN   - Nextcloud App Store API token; publishes the release to apps.nextcloud.com
#                      (requires APP_PRIVATE_KEY and a registered app certificate)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    # Secrets (APP_PRIVATE_KEY, APPSTORE_TOKEN) live in this environment; without them the steps are skipped.
    environment: appstore
    env:
      APP_ID: ebookreader
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The tag is the source of truth: its version is written into info.xml
      # (the only version Nextcloud reads), so a release needs nothing but a tag.
      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          CURRENT="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -n1)"
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "::notice::appinfo/info.xml has $CURRENT, building as $VERSION (from tag). Run 'make bump VERSION=$VERSION' to update the repo."
          fi
          sed -i "s:<version>.*</version>:<version>$VERSION</version>:" appinfo/info.xml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Build app package
        run: make appstore

      - name: Checksum
        working-directory: build/artifacts
        run: sha256sum "$APP_ID.tar.gz" > "$APP_ID.tar.gz.sha256"

      - name: Sign package (App Store)
        id: sign
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        if: env.APP_PRIVATE_KEY != ''
        working-directory: build/artifacts
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/app.key"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/app.key"
          openssl dgst -sha512 -sign "$RUNNER_TEMP/app.key" "$APP_ID.tar.gz" | openssl base64 -A > "$APP_ID.tar.gz.sig"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Release notes = the matching section of CHANGELOG.md (fallback: a pointer to the changelog);
      # GitHub's generated commit list is appended below it.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Headings follow the App Store parser: "## 1.2.3 ..." for releases, "## [Unreleased]" for pre-releases
          SECTION="$VERSION"
          if [ "$PRERELEASE" = "true" ]; then SECTION="[Unreleased]"; fi
          awk -v v="$SECTION" '
            !found && index($0, "## " v) == 1 { rest = substr($0, length("## " v) + 1); if (rest == "" || rest ~ /^[ \t]/) { found=1; next } }
            !found && index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ] || ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::warning::No section for $VERSION in CHANGELOG.md"
            echo "Siehe [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: E-Book Reader ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            build/artifacts/ebookreader.tar.gz
            build/artifacts/ebookreader.tar.gz.sha256
            build/artifacts/ebookreader.tar.gz.sig

      - name: Publish to Nextcloud App Store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        if: env.APPSTORE_TOKEN != '' && steps.sign.outputs.signed == 'true'
        run: |
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APP_ID}.tar.gz"
          SIGNATURE="$(cat build/artifacts/${APP_ID}.tar.gz.sig)"
          # Pre-releases are detected by the App Store from the version suffix; nightly is for nightly builds only.
          jq -n --arg d "$DOWNLOAD" --arg s "$SIGNATURE" \
            '{download: $d, signature: $s, nightly: false}' > "$RUNNER_TEMP/release.json"
          curl --fail-with-body -sS -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token $APPSTORE_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/release.json"
